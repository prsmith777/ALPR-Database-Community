services:
  db:
    image: postgres:17.10
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "${ALPR_POSTGRES_LOG_MAX_SIZE:-10m}"
        max-file: "${ALPR_POSTGRES_LOG_MAX_FILES:-5}"

  migrate:
    image: postgres:17.10
    restart: "no"
    environment:
      PGPASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
    depends_on:
      db:
        condition: service_healthy
    command:
      - psql
      - --no-psqlrc
      - --set
      - ON_ERROR_STOP=1
      - --single-transaction
      - --host
      - db
      - --username
      - postgres
      - --dbname
      - postgres
      - --file
      - /migrations.sql
    volumes:
      - ./migrations.sql:/migrations.sql:ro

volumes:
  db-data:
